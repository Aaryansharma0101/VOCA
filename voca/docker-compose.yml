# Optional local Neo4j for the ESCO skill/occupation graph.
# Supabase (Postgres + pgvector) is hosted - no container here.
#
#   cp .env.example .env          # set NEO4J_PASSWORD (8+ chars)
#   docker compose up -d neo4j
#   open http://localhost:7474    # browse the graph
#
# The API reads NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD from .env, so the
# defaults below must match. This file is for development only.

services:
  neo4j:
    image: neo4j:5-community
    container_name: voca-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
